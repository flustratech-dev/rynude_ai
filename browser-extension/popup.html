<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Rynude Connector</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f9f8f6;
      color: #2d2825;
    }
    .header {
      background: linear-gradient(135deg, #D97757 0%, #c66547 100%);
      color: white;
      padding: 16px;
      text-align: center;
    }
    .header h1 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .header p {
      font-size: 12px;
      opacity: 0.9;
    }
    .content {
      padding: 16px;
    }
    .provider {
      background: white;
      border: 1px solid #e5e5e5;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .provider-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .provider-icon {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 14px;
    }
    .provider-name {
      font-size: 14px;
      font-weight: 500;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 12px;
    }
    .status.connected {
      background: #d4edda;
      color: #155724;
    }
    .status.disconnected {
      background: #f8f9fa;
      color: #6c757d;
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
    }
    .status.connected .status-dot {
      background: #28a745;
    }
    .status.disconnected .status-dot {
      background: #6c757d;
    }
    .footer {
      padding: 12px 16px;
      background: white;
      border-top: 1px solid #e5e5e5;
      text-align: center;
      font-size: 12px;
      color: #6c757d;
    }
    .footer a {
      color: #D97757;
      text-decoration: none;
    }
    .footer a:hover {
      text-decoration: underline;
    }
    .loading {
      text-align: center;
      padding: 20px;
      font-size: 13px;
      color: #6c757d;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Rynude Connector</h1>
    <p>Provider Connection Status</p>
  </div>

  <div class="content">
    <div id="loading" class="loading">
      Loading...
    </div>

    <div id="providers" style="display: none;">
      <!-- ChatGPT -->
      <div class="provider">
        <div class="provider-info">
          <div class="provider-icon" style="background: #f0f0f0; color: #2d2825;">
            <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M22.2819 9.8211a5.9847 5.9847 0 0 0-.5157-4.9108 6.0462 6.0462 0 0 0-6.5098-2.9A6.0651 6.0651 0 0 0 4.9807 4.1818a5.9847 5.9847 0 0 0-3.9977 2.9 6.0462 6.0462 0 0 0 .7427 7.0966 5.98 5.98 0 0 0 .511 4.9107 6.051 6.051 0 0 0 6.5146 2.9001A5.9847 5.9847 0 0 0 13.2599 24a6.0557 6.0557 0 0 0 5.7718-4.2058 5.9894 5.9894 0 0 0 3.9977-2.9001 6.0557 6.0557 0 0 0-.7475-7.0729zm-9.022 12.6081a4.4755 4.4755 0 0 1-2.8764-1.0408l.1419-.0804 4.7783-2.7582a.7948.7948 0 0 0 .3927-.6813v-6.7369l2.02 1.1686a.071.071 0 0 1 .038.052v5.5826a4.504 4.504 0 0 1-4.4945 4.4944zm-9.6607-4.1254a4.4708 4.4708 0 0 1-.5346-3.0137l.142.0852 4.783 2.7582a.7712.7712 0 0 0 .7806 0l5.8428-3.3685v2.3324a.0804.0804 0 0 1-.0332.0615L9.74 19.9502a4.4992 4.4992 0 0 1-6.1408-1.6464z"/></svg>
          </div>
          <div class="provider-name">ChatGPT</div>
        </div>
        <div id="chatgpt-status" class="status disconnected">
          <div class="status-dot"></div>
          <span>Not Connected</span>
        </div>
      </div>

      <!-- Gemini -->
      <div class="provider">
        <div class="provider-info">
          <div class="provider-icon" style="background: #e3f2fd; color: #1976d2;">G</div>
          <div class="provider-name">Gemini</div>
        </div>
        <div id="gemini-status" class="status disconnected">
          <div class="status-dot"></div>
          <span>Not Connected</span>
        </div>
      </div>

      <!-- Claude -->
      <div class="provider">
        <div class="provider-info">
          <div class="provider-icon" style="background: #fff3e0; color: #D97757;">C</div>
          <div class="provider-name">Claude</div>
        </div>
        <div id="claude-status" class="status disconnected">
          <div class="status-dot"></div>
          <span>Not Connected</span>
        </div>
      </div>
    </div>
  </div>

  <div class="footer">
    Open <a href="http://localhost:8080/api-keys" target="_blank">Rynude</a> to connect
  </div>

  <script src="popup.js"></script>
</body>
</html>
